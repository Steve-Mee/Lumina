// LUMINA Execution Fabric — gRPC contract (SSOT)
// Package: lumina.execution.v1
// Blueprint: project-dna/lumina/evolution/LUMINA_Execution_Fabric_Blueprint_v1.1_EN.md
// ADR: docs/adr/0035-execution-fabric-grpc.md
//
// Evolution rules:
// - Additive fields only within a major version.
// - Unknown critical enums MUST be rejected fail-closed by Fabric.
// - client_order_id is the idempotency key for place/modify/cancel.

syntax = "proto3";

package lumina.execution.v1;

option csharp_namespace = "Lumina.Execution.V1";
option java_multiple_files = true;
option java_package = "lumina.execution.v1";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service ExecutionFabric {
  // Bidirectional real-time channel: Brain commands ↔ Fabric events.
  rpc TradingStream(stream BrainMessage) returns (stream FabricMessage);

  // Full account / position / working-order snapshot (reconciliation).
  rpc GetAccountState(GetAccountStateRequest) returns (AccountState);

  // Historical bars/ticks for model input or backfill (Phase 0 may stub).
  rpc RequestHistoricalData(HistoricalDataRequest) returns (HistoricalDataResponse);

  // Dynamic safety limits (Phase 2+; Phase 0 may accept no-op / read defaults).
  rpc SetRiskParameters(RiskParameters) returns (RiskParametersAck);
  rpc GetRiskParameters(GetRiskParametersRequest) returns (RiskParameters);
}

// ---------------------------------------------------------------------------
// Stream envelopes
// ---------------------------------------------------------------------------

message BrainMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    PlaceOrderCommand place_order = 2;
    CancelOrderCommand cancel_order = 3;
    ModifyOrderCommand modify_order = 4;
    FlattenCommand flatten = 5;
    SubscribeMarketData subscribe_market_data = 6;
    UnsubscribeMarketData unsubscribe_market_data = 7;
    AuthHello auth_hello = 8;
  }
}

message FabricMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    OrderEvent order_event = 2;
    PositionUpdate position_update = 3;
    MarketDataUpdate market_data = 4;
    StateSyncResponse state_sync = 5;
    SafetyAlert safety_alert = 6;
    AuthResult auth_result = 7;
    CommandReject command_reject = 8;
  }
}

// ---------------------------------------------------------------------------
// Auth (localhost shared secret)
// ---------------------------------------------------------------------------

message AuthHello {
  string token = 1;
  string client_name = 2;
  string client_version = 3;
  string mode_context = 4;  // paper | sim | sim_real_guard | real
}

message AuthResult {
  bool ok = 1;
  string session_id = 2;
  string code = 3;
  string message = 4;
  string account_name = 5;
}

// ---------------------------------------------------------------------------
// Heartbeat & safety
// ---------------------------------------------------------------------------

message Heartbeat {
  uint64 sequence_number = 1;
  // Unix epoch milliseconds (UTC).
  int64 timestamp_unix_ms = 2;
  string brain_status = 3;
  string last_known_state_hash = 4;
  SafeModeState fabric_safe_mode = 5;  // set by Fabric on outbound HB
}

enum SafeModeState {
  SAFE_MODE_STATE_UNSPECIFIED = 0;
  SAFE_MODE_STATE_NORMAL = 1;
  SAFE_MODE_STATE_SAFE = 2;
  SAFE_MODE_STATE_FULL_SAFE = 3;
}

message SafetyAlert {
  SafetyAlertType alert_type = 1;
  SafetySeverity severity = 2;
  string message = 3;
  string recommended_action = 4;
  int64 timestamp_unix_ms = 5;
  string correlation_id = 6;
}

enum SafetyAlertType {
  SAFETY_ALERT_TYPE_UNSPECIFIED = 0;
  SAFETY_ALERT_TYPE_HEARTBEAT_TIMEOUT = 1;
  SAFETY_ALERT_TYPE_ORDER_REJECTED = 2;
  SAFETY_ALERT_TYPE_POSITION_LIMIT_BREACHED = 3;
  SAFETY_ALERT_TYPE_SAFE_MODE_ENTERED = 4;
  SAFETY_ALERT_TYPE_FLATTEN_ISSUED = 5;
  SAFETY_ALERT_TYPE_NT_CONNECTION_LOST = 6;
  SAFETY_ALERT_TYPE_AUTH_FAILED = 7;
}

enum SafetySeverity {
  SAFETY_SEVERITY_UNSPECIFIED = 0;
  SAFETY_SEVERITY_INFO = 1;
  SAFETY_SEVERITY_WARNING = 2;
  SAFETY_SEVERITY_CRITICAL = 3;
}

// ---------------------------------------------------------------------------
// Orders
// ---------------------------------------------------------------------------

enum OrderAction {
  ORDER_ACTION_UNSPECIFIED = 0;
  ORDER_ACTION_BUY = 1;
  ORDER_ACTION_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_DAY = 1;
  TIME_IN_FORCE_GTC = 2;
  TIME_IN_FORCE_IOC = 3;
  TIME_IN_FORCE_FOK = 4;
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_SUBMITTED = 1;
  ORDER_STATE_WORKING = 2;
  ORDER_STATE_PARTIALLY_FILLED = 3;
  ORDER_STATE_FILLED = 4;
  ORDER_STATE_CANCELLED = 5;
  ORDER_STATE_REJECTED = 6;
}

message PlaceOrderCommand {
  // UUID v4 generated by Brain — idempotency key.
  string client_order_id = 1;
  string instrument = 2;
  OrderAction action = 3;
  int32 quantity = 4;
  OrderType order_type = 5;
  double price = 6;
  double stop_price = 7;
  TimeInForce time_in_force = 8;
  bool reduce_only = 9;
  // If true, not auto-cancelled on disconnect/timeout (with warnings).
  bool protected = 10;
  string correlation_id = 11;
  string mode_context = 12;
}

message CancelOrderCommand {
  string client_order_id = 1;
  string nt_order_id = 2;
  string correlation_id = 3;
}

message ModifyOrderCommand {
  string client_order_id = 1;
  string nt_order_id = 2;
  int32 quantity = 3;
  double price = 4;
  double stop_price = 5;
  string correlation_id = 6;
}

message FlattenCommand {
  // Empty instrument = all instruments (subject to policy).
  string instrument = 1;
  string correlation_id = 2;
  bool emergency = 3;
}

message OrderEvent {
  string client_order_id = 1;
  string nt_order_id = 2;
  OrderState state = 3;
  int32 filled_qty = 4;
  double avg_fill_price = 5;
  int64 timestamp_unix_ms = 6;
  string rejection_reason = 7;
  string instrument = 8;
  OrderAction action = 9;
  int32 leaves_qty = 10;
  string correlation_id = 11;
}

message CommandReject {
  string correlation_id = 1;
  string client_order_id = 2;
  string code = 3;
  string message = 4;
  SafeModeState safe_mode = 5;
}

// ---------------------------------------------------------------------------
// Positions / account / state sync
// ---------------------------------------------------------------------------

message PositionUpdate {
  string instrument = 1;
  int32 quantity = 2;
  double avg_price = 3;
  string side = 4;
  int64 timestamp_unix_ms = 5;
}

message WorkingOrder {
  string client_order_id = 1;
  string nt_order_id = 2;
  string instrument = 3;
  OrderAction action = 4;
  int32 quantity = 5;
  int32 filled_qty = 6;
  OrderType order_type = 7;
  double price = 8;
  double stop_price = 9;
  OrderState state = 10;
  bool protected = 11;
  bool reduce_only = 12;
}

message AccountMetrics {
  double balance = 1;
  double equity = 2;
  double available_margin = 3;
  double realized_pnl_today = 4;
  string currency = 5;
  string account_name = 6;
}

message StateSyncResponse {
  repeated WorkingOrder open_orders = 1;
  repeated PositionUpdate positions = 2;
  AccountMetrics account = 3;
  SafeModeState safe_mode = 4;
  int64 timestamp_unix_ms = 5;
  string state_hash = 6;
}

message GetAccountStateRequest {
  string correlation_id = 1;
}

message AccountState {
  AccountMetrics account = 1;
  repeated PositionUpdate positions = 2;
  repeated WorkingOrder open_orders = 3;
  SafeModeState safe_mode = 4;
  int64 timestamp_unix_ms = 5;
}

// ---------------------------------------------------------------------------
// Market data
// ---------------------------------------------------------------------------

message SubscribeMarketData {
  repeated string instruments = 1;
  bool include_ticks = 2;
  bool include_bars = 3;
  string bar_period = 4;  // e.g. "1m", "5m"
}

message UnsubscribeMarketData {
  repeated string instruments = 1;
}

message MarketDataUpdate {
  string instrument = 1;
  int64 timestamp_unix_ms = 2;
  double last = 3;
  double bid = 4;
  double ask = 5;
  int64 volume = 6;
  // Optional bar fields (0 if tick-only).
  double open = 7;
  double high = 8;
  double low = 9;
  double close = 10;
  bool is_bar = 11;
}

message HistoricalDataRequest {
  string instrument = 1;
  string bar_period = 2;
  int64 start_unix_ms = 3;
  int64 end_unix_ms = 4;
  int32 max_bars = 5;
  string correlation_id = 6;
}

message HistoricalDataResponse {
  string instrument = 1;
  repeated MarketDataUpdate bars = 2;
  string correlation_id = 3;
  string code = 4;
  string message = 5;
}

// ---------------------------------------------------------------------------
// Risk parameters (Fabric-side safety)
// ---------------------------------------------------------------------------

message RiskParameters {
  int32 max_position_size = 1;
  double daily_loss_limit = 2;
  int32 max_orders_per_minute = 3;
  int32 heartbeat_timeout_ms = 4;
  int32 flatten_grace_ms = 5;
  bool flatten_on_timeout = 6;
  map<string, int32> max_position_by_instrument = 7;
}

message RiskParametersAck {
  bool accepted = 1;
  string message = 2;
  RiskParameters applied = 3;
}

message GetRiskParametersRequest {
  string correlation_id = 1;
}
