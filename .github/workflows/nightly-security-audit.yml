name: Nightly Security Audit

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every night
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  dependency-audit:
    name: safety + pip-audit + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-trading.txt
            requirements-dev.txt

      - name: Install audit tooling
        run: pip install --quiet -r requirements-dev.txt

      - name: pip-audit (core + trading requirements)
        run: |
          # Starlette PYSEC-2026-161: FastAPI still pins Starlette.
          # filelock 4.x blocked by safety (filelock<4.0) through 3.8.1.
          pip-audit --requirement requirements-core.txt \
            --format json \
            --output pip_audit_report.json \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln GHSA-v4x8-3wr5-3wq8 \
            --ignore-vuln GHSA-9vhv-jxww-xfm5 \
            --ignore-vuln GHSA-567q-5qvw-pf92 \
            --ignore-vuln GHSA-j8f7-rjxc-mr56 \
            --ignore-vuln GHSA-8mx5-7m5m-r77g \
            --ignore-vuln GHSA-69hj-f68j-2879 \
            --ignore-vuln GHSA-rfpc-qcw5-3pc4 \
            --ignore-vuln GHSA-cwqr-hh33-gh44 \
            --ignore-vuln GHSA-fq56-3cx3-fjxp \
            --skip-editable || true
          pip-audit --requirement requirements-core.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln GHSA-v4x8-3wr5-3wq8 \
            --ignore-vuln GHSA-9vhv-jxww-xfm5 \
            --ignore-vuln GHSA-567q-5qvw-pf92 \
            --ignore-vuln GHSA-j8f7-rjxc-mr56 \
            --ignore-vuln GHSA-8mx5-7m5m-r77g \
            --ignore-vuln GHSA-69hj-f68j-2879 \
            --ignore-vuln GHSA-rfpc-qcw5-3pc4 \
            --ignore-vuln GHSA-cwqr-hh33-gh44 \
            --ignore-vuln GHSA-fq56-3cx3-fjxp
          pip-audit --requirement requirements-trading.txt

      - name: safety audit (scan/check fallback)
        run: python scripts/validation/run_safety_audit.py

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          pip install --quiet -r requirements-core.txt -r requirements-trading.txt
          cyclonedx-py environment --output-format JSON -o docs/sbom.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: |
            pip_audit_report.json
            docs/sbom.json
            state/safety_scan_report.json
          if-no-files-found: warn
          retention-days: 30
