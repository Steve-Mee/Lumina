[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumina"
version = "5.0.0"
description = "Lumina NinjaTrader AI trading engine"
requires-python = ">=3.13"
readme = "README.md"

[tool.lumina.dependencies]
core = "requirements-core.txt"
trading = "requirements-trading.txt"
ml = "requirements-ml.txt"
dev = "requirements-dev.txt"
all = "requirements.txt"

[tool.lumina.security]
sbom_output = "docs/sbom.json"
audit_commands = ["python scripts/validation/run_safety_audit.py", "pip-audit"]

[tool.mypy]
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"

[project.optional-dependencies]
test = ["pytest-asyncio>=1.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lumina_launcher*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
